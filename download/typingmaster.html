<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải TypingMaster 11 | SMART SCHOOL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #f0fdfa; 
            --bg-card: #ffffff; 
            --border-tech: rgba(8, 145, 178, 0.2); 
            --primary-neon: #0891b2; 
            --text-glow: #083344; 
            --shadow-neo: 0 20px 50px rgba(8, 145, 178, 0.12), 0 0 0 1px rgba(8, 145, 178, 0.05);
        }
        
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body {
            background-color: var(--bg-deep); color: var(--text-glow); font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
            background-image: linear-gradient(rgba(8, 145, 178, 0.02) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(8, 145, 178, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* 1. QUẢNG CÁO SIDEBAR */
        .ad-full-sidebar {
            position: fixed; top: 0; height: 100vh; width: 180px;
            background: #fff; border: 1px dashed var(--primary-neon);
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; z-index: 1000; font-size: 0.7rem; text-align: center;
        }
        .ad-left { left: 0; } .ad-right { right: 0; }

        /* 2. HEADER DÀN 2 BÊN */
        .header-container {
            height: 20vh; display: flex; justify-content: space-between; align-items: center;
            margin: 0 auto; width: calc(100% - 400px); max-width: 1000px; z-index: 10; margin-bottom: -30px;
        }
        .home-btn {
            width: 42px; height: 42px; border-radius: 12px; display: flex; justify-content: center; align-items: center;
            color: var(--primary-neon); background: #fff; border: 1px solid var(--border-tech); text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: 0.3s;
        }
        .home-btn:hover { background: var(--primary-neon); color: #fff; transform: translateY(-3px); }
        .header-title {
            font-family: 'Rajdhani', sans-serif; font-weight: 800; font-size: 2.3rem; 
            text-transform: uppercase; letter-spacing: 2px; margin: 0;
            background: linear-gradient(90deg, #0f766e, #0891b2, #0369a1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .visit-badge {
            display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border-tech);
            padding: 8px 15px; border-radius: 12px; font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem; font-weight: 700; color: var(--primary-neon);
        }

        /* 3. NỘI DUNG CHÍNH */
        .content-main {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            margin: 0 auto; width: calc(100% - 400px); max-width: 1000px; padding-bottom: vh;
        }
        .card-body {
            background: var(--bg-card); padding: 3vh 40px; border-radius: 25px;
            box-shadow: var(--shadow-neo); border: 1px solid var(--border-tech);
        }
        .step-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 3vh; }
        .step-box { text-align: center; padding: 15px; border-radius: 15px; background: #fcfdfd; border: 1px solid rgba(8, 145, 178, 0.05); }
        .step-num {
            width: 50px; height: 50px; background: var(--primary-neon); color: #fff;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            margin: 0 auto 30px auto; font-weight: 800; font-size: 1.3rem;
        }
        .step-txt { font-size: 0.8rem; font-weight: 600; margin-bottom: 12px; min-height: 40px; line-height: 1.4; }
        .img-container { width: 100%; aspect-ratio: 16/10; border-radius: 10px; overflow: hidden; border: 3px solid #eee; background: #fff; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* KHU VỰC THÔNG BÁO TẢI (STYLE BẢN ĐẦU) */
        .download-alert {
            background: rgba(8, 145, 178, 0.08); /* Xanh nhẹ */
            border: 1px solid var(--border-tech);
            border-radius: 12px; padding: 18px; text-align: center;
            font-size: 0.85rem; color: var(--text-glow); font-weight: 500;
        }
        .download-alert i { color: var(--primary-neon); margin-right: 8px; }
        #countdown { font-family: 'Roboto Mono', monospace; font-weight: 800; color: #ef4444; font-size: 0.85rem; }
        .manual-link { 
            color: var(--primary-neon); font-weight: 700; text-decoration: none; 
            border-bottom: 1px dashed var(--primary-neon); transition: 0.3s;
        }
        .manual-link:hover { border-bottom-style: solid; }

        .ad-bottom {
            height: 90px; width: 100%; border: 1px dashed #cbd5e1; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 0.7rem; background: #fff; margin-top: 2vh;
        }

        @media (max-height: 800px) { .header-title { font-size: 1.8rem; } .card-body { padding: 2vh 30px; } }
    </style>
</head>
<body>

    <div class="ad-full-sidebar ad-left">ADSENSE SIDEBAR LEFT</div>
    <div class="ad-full-sidebar ad-right">ADSENSE SIDEBAR RIGHT</div>

    <div class="header-container">
        <a href="../index.html" class="home-btn" title="Về trang chủ"><i class="fas fa-home"></i></a>
        <h1 class="header-title">DOWNLOAD TYPING MASTER 11</h1>
        <div class="visit-badge" title="Tổng lượt tải"><i class="fas fa-download"></i> <span id="counter">...</span></div>
    </div>

    <div class="content-main">
        <div class="card-body">
            <div class="step-grid">
                <div class="step-box">
                    <div class="step-num">1</div>
                    <div class="img-container"><img id="pic1" src=""></div>
                </div>
                <div class="step-box">
                    <div class="step-num">2</div>
                    <div class="img-container"><img id="pic2" src=""></div>
                </div>
                <div class="step-box">
                    <div class="step-num">3</div>
                    <div class="img-container"><img id="pic3" src=""></div>
                </div>
            </div>

            <div class="download-alert">
                <i class="fas fa-spinner fa-spin"></i> 
                Quá trình tải xuống sẽ tự động bắt đầu sau <span id="countdown">5</span> giây... 
                Nếu không tự tải, <a href="#" id="link-dl" class="manual-link">nhấn vào đây</a> để tải thủ công.
            </div>
        </div>

        <div class="ad-bottom">ADSENSE HORIZONTAL FOOTER</div>
    </div>

    <script>
        const DRIVE_IDS = {
            file: "13EKZadfyx80hUZxZS7W7kM1nYBMPwqPG",
            img1: "1HFZVRgdvBWg4nsO5I27Q92EqQZG8UcoJ",
            img2: "1eJ9QGzs4HdqLo5BOa0irQCO2DRVrbDsl",
            img3: "1EYEQmEcIncA-kUOPDBZIcfGmCJDgYux6"
        };

        function makeLink(id, isDownload = false) {
            return isDownload 
                ? `https://drive.google.com/uc?export=download&id=${id}`
                : `https://drive.google.com/thumbnail?authuser=0&sz=w1200&id=${id}`; 
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('pic1').src = makeLink(DRIVE_IDS.img1);
            document.getElementById('pic2').src = makeLink(DRIVE_IDS.img2);
            document.getElementById('pic3').src = makeLink(DRIVE_IDS.img3);
            
            const dlUrl = makeLink(DRIVE_IDS.file, true);
            document.getElementById('link-dl').href = dlUrl;

            fetch('https://api.counterapi.dev/v1/smartschool_io_vn/typingmaster_dl/up')
                .then(r => r.json()).then(d => document.getElementById('counter').innerText = d.count.toLocaleString());

            let s = 120;
            const t = setInterval(() => {
                s--;
                document.getElementById('countdown').innerText = s;
                if (s <= 0) { clearInterval(t); window.location.href = dlUrl; }
            }, 1000);
        });
    </script>
</body>
</html>
