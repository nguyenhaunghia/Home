<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
           
    <title>Luyện Gõ 10 Ngón Online - Mario Teaches Typing | SMART SCHOOL</title>
    <meta name="description" content="Phần mềm luyện gõ 10 ngón Mario Teaches Typing trực tuyến">
    <meta name="keywords" content="luyện gõ 10 ngón, mario teaches typing, luyện tập gõ phím, học đánh máy online, smart school, giáo dục số, tin học, tin học 6, mario, luyện gõ, online">
    <meta name="robots" content="index, follow">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
    <style>
        :root {
            --bg-deep: #f0fdfa; 
            --bg-card: #ffffff; 
            --border-tech: rgba(8, 145, 178, 0.2); 
            --primary-neon: #0891b2; 
            --text-glow: #083344; 
            --shadow-neo: 0 20px 50px rgba(8, 145, 178, 0.12), 0 0 0 1px rgba(8, 145, 178, 0.05);
        }
        
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body {
            background-color: var(--bg-deep); color: var(--text-glow);
            font-family: 'Inter', sans-serif; display: flex; flex-direction: column;
        }

        /* 1. BỐ CỤC SIDEBAR QUẢNG CÁO */
        .main-layout {
            display: flex; width: 100%; height: 100vh;
            justify-content: center; align-items: stretch;
        }

        .ad-full-sidebar {
            flex: 1; background: #fff; border: 1px dashed var(--primary-neon);
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 0.8rem; text-align: center; z-index: 100;
        }

        /* 2. CỤM NỘI DUNG CHÍNH */
        .content-main {
            display: flex; flex-direction: column; width: auto; height: 100%;
            z-index: 101; padding: 0 10px;
        }

        /* HEADER THU GỌN TỐI ĐA */
        .header-container {
            height: 9vh; display: flex; justify-content: space-between; align-items: center; width: 100%;
        }
        .home-btn {
            width: 35px; height: 35px; border-radius: 10px; display: flex; justify-content: center; align-items: center;
            color: var(--primary-neon); background: #fff; border: 1px solid var(--border-tech); text-decoration: none;
        }
        .header-title {
            font-family: 'Rajdhani', sans-serif; font-weight: 800; font-size: 1.8rem; 
            text-transform: uppercase; letter-spacing: 3px; margin: 0 15px;
            background: linear-gradient(90deg, #0f766e, #0891b2, #0369a1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap;
        }
        .visit-badge {
            display: flex; align-items: center; gap: 5px; background: #fff; border: 1px solid var(--border-tech);
            padding: 4px 10px; border-radius: 10px; font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem; font-weight: 700; color: var(--primary-neon);
        }

        /* 3. KHU VỰC GAME: CƯỠNG ÉP PHÓNG TO */
        .game-card {
            background: var(--bg-card); padding: 3px; border-radius: 12px;
            box-shadow: var(--shadow-neo); border: 1px solid var(--border-tech);
            border-bottom: 4px solid var(--primary-neon);
        }

        .mario-box {
            background: #000; border-radius: 10px; overflow: hidden;
            height: 82vh !important; /* ĐẨY LÊN 82% CHIỀU CAO MÀN HÌNH */
            aspect-ratio: 4 / 3; 
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        
        /* NUCLEAR CSS: ÉP TẤT CẢ CÁC LỚP BÊN TRONG PHẢI FULL KHUNG */
        .mario-box * {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        canvas { 
            object-fit: fill !important; /* ÉP DÃN KHÔNG CÒN VIỀN ĐEN */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* FOOTER QUẢNG CÁO MỎNG SÁT ĐÁY */
        .ad-footer {
            height: 60px; width: 100%; border: 1px dashed #cbd5e1; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 0.6rem; background: #fff; 
            margin-top: auto; margin-bottom: 1vh;
        }

        @media (max-height: 700px) {
            .header-title { font-size: 1.4rem; }
            .mario-box { height: 78vh !important; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="ad-full-sidebar">QUẢNG CÁO DỌC TRÁI</div>

        <div class="content-main">
            <div class="header-container">
                <a href="../index.html" class="home-btn"><i class="fas fa-home"></i></a>
                <h1 class="header-title">TEACHES TYPING MARIO</h1>
                <div class="visit-badge"><i class="fas fa-satellite-dish"></i> <span id="visit-count">...</span></div>
            </div>

            <div class="game-card">
                <div class="mario-box" id="dosbox-container">
                    <canvas id="mario-canvas"></canvas>
                </div>
            </div>

            <div class="ad-footer">ADSENSE HORIZONTAL</div>
        </div>

        <div class="ad-full-sidebar">QUẢNG CÁO DỌC PHẢI</div>
    </div>

    <script src="mario.js"></script>
    <script>
        const smartSchoolTitle = "Mario | SMART SCHOOL";
        document.title = smartSchoolTitle;
        Object.defineProperty(document, "title", { get: function() { return smartSchoolTitle; }, set: function() { } });
        
        document.addEventListener("DOMContentLoaded", function() {
            fetch('https://api.counterapi.dev/v1/smartschool_io_vn/mario_game/up')
                .then(r => r.json()).then(d => {
                    document.getElementById('visit-count').innerText = d.count.toLocaleString('vi-VN');
                });
            
            // Ép canvas fill liên tục để chống lại trình giả lập tự thu nhỏ
            const forceFull = () => {
                const container = document.getElementById('dosbox-container');
                if (container) {
                    const elements = container.querySelectorAll('*');
                    elements.forEach(el => {
                        el.style.width = "100%";
                        el.style.height = "100%";
                    });
                }
            };

            setInterval(forceFull, 500); // Kiểm tra mỗi nửa giây
        });
    </script>
</body>
</html>
