<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Gõ 10 Ngón - SMART SCHOOL</title>
    <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
    <style>
        body {
            background-color: #0f172a; /* Màu nền tối đồng bộ hệ thống */
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .header-title {
            margin-bottom: 20px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .game-container {
            width: 100%;
            max-width: 640px; /* Kích thước chuẩn của game DOS */
            background: #000;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #334155;
        }
        canvas {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
        .back-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }
        .back-btn:hover { background: #475569; }
    </style>
</head>
<body>

    <h2 class="header-title"><i class="fas fa-keyboard"></i> LUYỆN GÕ 10 NGÓN MARIO</h2>
    
    <div class="game-container">
        <canvas id="mario-canvas"></canvas>
    </div>

    <a href="index.html" class="back-btn">Trở về Bảng Điều Khiển</a>

    <script src="mario.js"></script>
</body>
</html>
