<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
            
    <title>Mô Phỏng Hình Học | SMART SCHOOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #f0fdfa; 
            --bg-card: #ffffff; 
            --border-tech: rgba(8, 145, 178, 0.2); 
            --primary-neon: #0891b2; 
            --text-glow: #083344; 
            --shadow-neo: 0 20px 50px rgba(8, 145, 178, 0.12), 0 0 0 1px rgba(8, 145, 178, 0.05);
        }
        
        /* FIX: Reset padding, margin cho html và body để không bị hở viền */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { background-color: var(--bg-deep); color: var(--text-glow); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; }

        .main-layout { display: flex; width: 100%; height: 100vh; justify-content: center; align-items: stretch; }
        
        /* FIX QUẢNG CÁO: Đưa position: relative để nó ôm sát khung flex */
        .ad-full-sidebar { 
            flex: 1; 
            background: #fff; 
            border: 1px dashed var(--primary-neon); 
            display: flex; align-items: center; justify-content: center; 
            color: #94a3b8; font-size: 0.8rem; text-align: center; 
            z-index: 100; 
            position: relative; /* Giúp quảng cáo ôm sát container cha */
            height: 100%; /* Bung lụa 100% chiều cao */
            overflow: hidden; /* Giữ quảng cáo không tràn viền */
        }
        
        /* CỘT GIỮA */
        .content-main { 
            display: flex; 
            flex-direction: column; 
            width: calc(82vh * 4 / 3); 
            max-width: 96vw; 
            height: 100%; 
            z-index: 101; 
            margin: 0 12px; 
        }

        .header-container { height: 9vh; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .home-btn { width: 35px; height: 35px; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: var(--primary-neon); background: #fff; border: 1px solid var(--border-tech); text-decoration: none; }
        .header-title { 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 800; 
            font-size: 1.6rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin: 0 15px; 
            background: linear-gradient(90deg, #0f766e, #0891b2, #0369a1); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text; 
            color: transparent; 
            white-space: nowrap; 
        }

        .visit-badge { display: flex; align-items: center; gap: 5px; background: #fff; border: 1px solid var(--border-tech); padding: 4px 10px; border-radius: 10px; font-family: 'Roboto Mono', monospace; font-size: 0.75rem; font-weight: 700; color: var(--primary-neon); }

        .action-btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .action-btn.primary { background: var(--primary-neon); color: white; }
        .action-btn.primary:hover { background: #06b6d4; transform: translateY(-2px); }

        /* KHUNG TÀI LIỆU */
        #doc-view { display: none; height: 82vh; width: 100%; background: #fff; border-radius: 12px; box-shadow: var(--shadow-neo); border: 1px solid var(--border-tech); overflow: hidden; }
        #doc-view iframe { width: 100%; height: 100%; border: none; }

        /* TẤM BÌA BẢNG VẼ */
        .game-card { 
            background: var(--bg-card); 
            padding: 0; 
            border-radius: 12px; 
            box-shadow: var(--shadow-neo); 
            border: 1px solid var(--border-tech); 
            border-bottom: 4px solid var(--primary-neon); 
            position: relative; 
            width: 100%; 
            height: 82vh;
        }

        /* KHUNG CANVAS */
        .tool-box { 
            background: transparent; 
            border-radius: 10px; 
            overflow: hidden; 
            width: 100%; 
            height: 100%; 
            position: relative; 
            cursor: crosshair; 
        }

        .tool-box canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #layer-draw { z-index: 1; }
        #layer-tools { z-index: 2; pointer-events: none; }
        #ui-layer { position: absolute; top: 20px; left: 0; width: 100%; text-align: center; z-index: 3; pointer-events: none; }
                
        /* =========================================
           FIX CSS: ĐỘ TIÊU ĐỀ BÀI HỌC (NẰM TRÊN KHUNG VẼ)
           ========================================= */
        .tool-title { 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 800; 
            font-size: 2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin-bottom: 5px;
            
            background: linear-gradient(90deg, #0f766e, #0891b2, #0369a1); 
            background-clip: text; 
            -webkit-background-clip: text; 
            color: transparent; 
            -webkit-text-fill-color: transparent;
            
            filter: drop-shadow(0 2px 5px rgba(255, 255, 255, 0.8)) 
                    drop-shadow(0 4px 10px rgba(8, 145, 178, 0.15));
        }

        @media (max-height: 700px) {
            .tool-title { font-size: 1.6rem; letter-spacing: 1px; }
        }
        
        .instruction { font-size: 18px; color: #d93025; margin-top: 5px; font-weight: 600; background: rgba(255, 255, 255, 0.8); display: inline-block; padding: 2px 15px; border-radius: 20px; }

        #board-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; }

        /* MODAL POPUP */
        #board-wrapper.is-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 51, 68, 0.85);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        
        #board-wrapper.is-modal .game-card {
            width: calc(85vh * 4 / 3); 
            height: 85vh;
            max-width: 95vw;
        }

        #close-modal-btn {
            position: absolute; top: -15px; right: -15px; width: 35px; height: 35px;
            border-radius: 50%; background: #ef4444; color: white; border: 2px solid white;
            font-weight: bold; cursor: pointer; display: none; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 16px;
        }
        #board-wrapper.is-modal #close-modal-btn { display: block; }

        .ad-footer { height: 60px; width: 100%; border: 1px dashed #cbd5e1; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.6rem; background: #fff; margin-top: auto; margin-bottom: 1vh; overflow: hidden; }

        @media (max-height: 700px) {
            .header-title { font-size: 1.4rem; }
            .tool-title { font-size: 18px; }
            .instruction { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="ad-full-sidebar" style="border-right: 1px solid var(--border-tech);">
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9531418462807701" crossorigin="anonymous"></script>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-9531418462807701"
                 data-ad-slot="2562941589"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <div class="content-main">
            <div class="header-container">
                <a href="../index.html" class="home-btn"><i class="fas fa-home"></i></a>
                <h1 class="header-title">MATH</h1>
                
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div id="dynamic-buttons"></div>
                    <div class="visit-badge"><i class="fas fa-satellite-dish"></i> <span id="visit-count">...</span></div>
                </div>
            </div>

            <div id="doc-view">
                <iframe id="docIframe" src=""></iframe>
            </div>

            <div id="board-wrapper">
                <div class="game-card">
                    <button id="close-modal-btn" onclick="closeBoardModal()"><i class="fas fa-times"></i></button>
                    <div class="tool-box" id="app-container">
                        <div id="ui-layer">
                            <div class="tool-title">Đang tải dữ liệu...</div>
                            <div class="instruction" id="text-instruction">Vui lòng chờ trong giây lát</div>
                        </div>
                        <canvas id="layer-draw" width="800" height="600"></canvas>
                        <canvas id="layer-tools" width="800" height="600"></canvas>
                    </div>
                </div>
            </div>

            <div class="ad-footer">
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9531418462807701" crossorigin="anonymous"></script>
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-9531418462807701"
                     data-ad-slot="2720743350"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>

        <div class="ad-full-sidebar" style="border-left: 1px solid var(--border-tech);">
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9531418462807701" crossorigin="anonymous"></script>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-9531418462807701"
                 data-ad-slot="2562941589"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <script src="geometry_tools.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('https://api.counterapi.dev/v1/smartschool_io_vn/geometry_sim/up')
                .then(r => r.json()).then(d => {
                    document.getElementById('visit-count').innerText = d.count.toLocaleString('vi-VN');
                });
        });

        const boardWrapper = document.getElementById('board-wrapper');
        
        function openBoardModal() {
            boardWrapper.classList.add('is-modal');
            boardWrapper.style.display = 'flex';
        }

        function closeBoardModal() {
            boardWrapper.classList.remove('is-modal');
            boardWrapper.style.display = 'none';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const bai = urlParams.get('bai'); 
        const docUrl = urlParams.get('docUrl'); 

        const docView = document.getElementById('doc-view');
        const iframe = document.getElementById('docIframe');
        const btnContainer = document.getElementById('dynamic-buttons');
        const headerTitle = document.querySelector('.header-title');

        // BẮT ĐẦU THÊM MỚI: Hàm xử lý link Google Docs
        function cleanGoogleDocUrl(url) {
            if (!url) return "";
            if (url.includes("docs.google.com/document/d/")) {
                return url.replace(/\/edit.*$/, "/preview");
            }
            return url;
        }
        // KẾT THÚC THÊM MỚI

        function loadLessonScript(lessonName) {
            const script = document.createElement('script');
            script.src = `lessons/${lessonName}.js`;
            script.onload = () => { if (typeof window.startLesson === 'function') window.startLesson(environment); };
            script.onerror = () => {
                document.getElementById('text-instruction').innerText = "Không tìm thấy dữ liệu bài học!";
                document.querySelector('.tool-title').innerText = "LỖI TẢI DỮ LIỆU";
            };
            document.body.appendChild(script);
        }

        if (bai && !docUrl) {
            docView.style.display = 'none';
            boardWrapper.style.display = 'flex'; 
            boardWrapper.classList.remove('is-modal'); 
            loadLessonScript(bai);
        } 
        else if (!bai && docUrl) {
            docView.style.display = 'block';
            boardWrapper.style.display = 'none';
            // CẬP NHẬT GỌI HÀM
            iframe.src = cleanGoogleDocUrl(docUrl);
            headerTitle.innerText = "LÝ THUYẾT BÀI HỌC";
            document.querySelector('.tool-title').style.display = 'none'; 
        } 
        else if (bai && docUrl) {
            docView.style.display = 'block';
            boardWrapper.style.display = 'none'; 
            // CẬP NHẬT GỌI HÀM
            iframe.src = cleanGoogleDocUrl(docUrl);
            headerTitle.innerText = "LÝ THUYẾT & THỰC HÀNH";
            btnContainer.innerHTML = '<button onclick="openBoardModal()" class="action-btn primary"><i class="fas fa-pencil-ruler"></i> Thực Hành Vẽ</button>';
            loadLessonScript(bai);
        } 
        else {
            docView.style.display = 'none';
            boardWrapper.style.display = 'flex'; 
            loadLessonScript('bai1_doanthang');
        }

        const container = document.getElementById('app-container');
        const ctxDraw = document.getElementById('layer-draw').getContext('2d');
        const ctxTools = document.getElementById('layer-tools').getContext('2d');
        const textInst = document.getElementById('text-instruction');

        const imgRuler = new Image(); imgRuler.src = 'assets/Ruler.png'; 
        const imgPencil = new Image(); imgPencil.src = 'assets/Pencil.png';
        const imgEke = new Image(); imgEke.src = 'assets/Eke.png';
        const imgProtractor = new Image(); imgProtractor.src = 'assets/Protractor.png'; 

        const geoEngine = new GeometryEngine(ctxDraw, ctxTools, imgRuler, imgPencil, imgEke, imgProtractor, 800, 600);
        
        const environment = {
            container: container,
            ctxDraw: ctxDraw,
            ctxTools: ctxTools,
            textInst: textInst,
            geoEngine: geoEngine
        };
    </script>
</body>
</html>
