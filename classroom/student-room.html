<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vào Lớp Học - Smart School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sáng-xanh': '#E0F2FE',
                        'đọt-chuối': '#84CC16',
                        'đọt-chuối-hover': '#65A30D',
                    }
                }
            }
        }
    </script>
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="bg-sáng-xanh flex items-center justify-center p-4">

    <div class="bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-lg w-full max-w-md border border-white/50 text-center">
        <div class="mx-auto bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mb-4 shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
            </svg>
        </div>

        <h2 class="text-2xl font-bold text-blue-900 mb-2" id="displayLessonName">Đang tải dữ liệu...</h2>
        <p class="text-gray-600 text-sm mb-6" id="displayDescription">Vui lòng chờ trong giây lát.</p>

        <div class="p-4 bg-yellow-50 text-yellow-800 rounded-xl border border-yellow-200 text-sm text-left mb-6 shadow-sm">
            <p class="font-semibold mb-1">📌 Lưu ý từ hệ thống:</p>
            <ul class="list-disc pl-5 space-y-1">
                <li>Hệ thống đang <b>tự động ghi nhận</b> thời gian bạn có mặt.</li>
                <li>Vui lòng <b>không tắt trang này</b> trong suốt quá trình học để đảm bảo được tính điểm danh.</li>
            </ul>
        </div>

        <a href="#" id="joinMeetBtn" target="_blank"
            class="w-full bg-đọt-chuối hover:bg-đọt-chuối-hover text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            Tham Gia Google Meet
        </a>
    </div>

    <script>
        // 1. DỮ LIỆU GIẢ LẬP (MOCK DATA)
        // Vì hiện tại chúng ta chưa gắn Database, nên mình dùng Code sinh ra 1 ID học sinh ngẫu nhiên để bạn test.
        const currentStudent = {
            studentId: "HS_" + Math.floor(Math.random() * 10000), 
            studentName: "Học sinh Ẩn danh " + Math.floor(Math.random() * 100)
        };

        // Giả lập thông tin phòng học truyền từ giáo viên qua
        const mockRoomData = {
            lessonName: "Phòng học Smart School",
            description: "Các em mở camera và tắt mic khi vào lớp nhé!",
            meetUrl: "https://meet.google.com/" // Tạm để link Meet trang chủ
        };

        // 2. Hiển thị thông tin lên giao diện
        function initPage() {
            document.getElementById('displayLessonName').innerText = mockRoomData.lessonName;
            document.getElementById('displayDescription').innerText = mockRoomData.description;
            document.getElementById('joinMeetBtn').href = mockRoomData.meetUrl;
        }

        // 3. ĐIỂM DANH VÀO LỚP (Chạy ngay khi mở trang)
        window.addEventListener('DOMContentLoaded', () => {
            initPage(); 

            fetch('/api/attendance/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentStudent)
            })
            .then(res => res.json())
            .then(data => console.log("Hệ thống:", data.message))
            .catch(err => console.error("Lỗi điểm danh:", err));
        });

        // 4. ĐIỂM DANH THOÁT LỚP (Chạy khi học sinh tắt tab trình duyệt)
        window.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden') {
                const data = new Blob([JSON.stringify({ studentId: currentStudent.studentId })], {
                    type: 'application/json'
                });
                navigator.sendBeacon('/api/attendance/logout', data);
            }
        });
    </script>
</body>
</html>
